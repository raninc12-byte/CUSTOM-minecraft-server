# =====================================================
# Skyblock Plugin - Shop Configuration
# =====================================================
#
# Each category has:
#   icon:   Material shown in the category selector GUI
#   name:   Display name (color codes supported via '&')
#   items:  Map of Material -> { buy, sell, name }
#
# A buy or sell price of -1 (or missing) means the action is disabled.
# Materials must be valid Bukkit Material enum names (e.g. STONE, OAK_LOG).
#

