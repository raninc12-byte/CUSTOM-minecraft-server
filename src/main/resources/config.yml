# =====================================================
# Skyblock Plugin - Main Configuration
# =====================================================

economy:
  # Starting balance for new players
  starting-balance: 100.0
  # Currency symbol used in /balance and shop displays
  currency-symbol: "$"
  # Number of decimal places to display
  decimals: 2

island:
  # Name of the void world used for islands
  world: "skyblock_world"
  # Grid spacing between islands (in blocks)
  grid-spacing: 256
  # Y level where islands are generated
  start-y: 100
  # Maximum number of members per island (besides the owner)
  max-members: 5
  # World border size per island (in blocks)
  border-size: 200

oneblock:
  # Grid spacing between OneBlocks (kept large so they don't overlap islands)
  grid-spacing: 512
  # Y level where the OneBlock magic block is placed
  start-y: 100
  # Blocks per phase (mining this many advances to the next phase)
  blocks-per-phase: 200

hub:
  # Name of the hub world
  world: "hub"
  # Spawn coordinates in the hub
  spawn:
    x: 0
    y: 100
    z: 0

admin:
  # Username allowed to see and click the admin button in the main menu.
  # Only this player can open the admin panel from the menu GUI.
  owner-username: "gladgulis1972"
  # Whether the admin panel can be opened by ops via /admin
  enabled: true
  # Cooldown (in seconds) between /admin panel opens
  cooldown: 0

messages:
  prefix: "&8[&6Skyblock&8] "
  no-permission: "&cYou do not have permission to do that."
  player-not-found: "&cPlayer not found: {player}"
  reload-complete: "&aConfiguration reloaded."
