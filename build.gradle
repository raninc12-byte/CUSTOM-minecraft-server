plugins {
    id 'java'
}

group = 'com.gulis.skyblock'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc-repo'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    // Paper API 1.20.6
    compileOnly 'io.papermc.paper:paper-api:1.20.6-R0.1-SNAPSHOT'

    // SQLite JDBC driver (bundled with plugin)
    implementation 'org.xerial:sqlite-jdbc:3.46.1.0'

    // HikariCP for connection pooling (future MySQL support)
    implementation 'com.zaxxer:HikariCP:5.1.0'

    // Adventure API is bundled with Paper, no need to add
}

jar {
    // Include dependencies in the final jar (fat jar)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    filteringCharset = 'UTF-8'
    // Expand version in plugin.yml
    expand(version: project.version)
}
